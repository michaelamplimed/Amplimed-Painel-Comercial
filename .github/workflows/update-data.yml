name: Atualizar dados do Painel Amplimed

on:
  schedule:
    # A cada 30 minutos, das 07:00 às 19:00 no horário de Brasília.
    # Brasília = UTC-3, portanto 10:00 às 22:00 UTC.
    - cron: "*/30 10-22 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel-amplimed-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar dados atualizados do HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-hubspot-data.js

      - name: Verificar se houve alteração nos dados
        id: changes
        run: |
          if git diff --quiet -- data/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar dados atualizados
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/data.json

          git commit -m "chore: atualiza dados do painel via HubSpot"

          git push
