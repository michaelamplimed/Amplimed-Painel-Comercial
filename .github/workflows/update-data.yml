name: Atualizar dados do Painel Amplimed

on:
  schedule:
    # Roda de hora em hora das 10h às 22h UTC = 7h–19h BRT
    - cron: '0 10-22 * * *'
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write  # necessário para commitar o data.json atualizado

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar dados do HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-hubspot-data.js

      - name: Commitar data.json atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "chore: atualiza data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
